[project]
name = "recommandation-api-v2"
version = "0.1.0"
readme = "README.md"
description = "The new recommendation API of the pass Culture"
requires-python = ">=3.13,<4.0"

dependencies = [
    "aiocache~=0.12",
    "asyncpg~=0.31",
    "certifi>=2026.10.23",
    "dotenv~=0.9",
    "fastapi~=0.128",
    "geoalchemy2~=0.18",
    "google-cloud-aiplatform~=2.7",
    "google-cloud-logging~=3.13",
    "greenlet~=3.3",
    "gunicorn~=26.2",
    "h3~=4.4",
    "pydantic~=2.12",
    "redis~=8.1",
    "sqlalchemy~=2.0",
    "starlette>=1.3.1",
    "types-protobuf~=7.35",
    "uvicorn~=0.40",
]

[dependency-groups]
dev = [
    "commitizen~=4.12",
    "geopy~=2.5",
    "httpx~=0.28",
    "ipdb~=0.13",
    "pgcli~=4.4",
    "polyfactory~=3.3",
    "pre-commit~=4.5",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-cov~=7.1",
    "pytest-mock~=3.15",
    "pytest-socket>=0.8.0",
    "requests[socks]>=2.34.2",
    "ruff~=0.14",
    "streamlit~=1.56",
    "streamlit-folium~=0.27",
    "testcontainers~=4.14",
    "ty~=0.0.14",
    "watchfiles~=1.1",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { certifi = false, streamlit = false, virtualenv = false }
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "filelock>=4.2.1", # GHSA-567q-5qvw-pf92, GHSA-9vhv-jxww-xfm5, GHSA-v4x8-3wr5-3wq8
    "gitpython>=3.1.62",
    "idna>=3.15",
    "multidict>=6.9.1",
    "pillow>=13.0.0", # GHSA-22hg-r758-rrw9, GHSA-24rc-8hj2-v98c, GHSA-254f-3936-288h, GHSA-27h8-gf7j-v5hc, GHSA-332p-7hrc-92wf, GHSA-3j72-p6qg-6xp7, GHSA-4558-3h8r-v8xp, GHSA-462x-pgg6-55fp, GHSA-4rm8-3hmm-39fg, GHSA-4rr5-89j8-mwwm, GHSA-58r4-6rv3-gfh8, GHSA-5x8w-8jj5-q52h, GHSA-5xm2-6676-qcp9, GHSA-654x-cwwv-5j9c, GHSA-65qm-jvmh-6pqg, GHSA-74r2-7ff9-mjj2, GHSA-78g4-xqwv-q3g8, GHSA-7mwm-ghpf-9vrm, GHSA-8g5g-8vmr-9782, GHSA-9v9v-9qvf-h2hj, GHSA-c6hw-5grf-ff96, GHSA-cp9v-662q-vvx9, GHSA-f2g6-542v-9j58, GHSA-fc9g-5qg7-mf45, GHSA-g4qv-2jxx-769h, GHSA-g7cr-3p24-7wf7, GHSA-g842-9rc4-69pw, GHSA-gg2r-wvfm-q9rx, GHSA-j4m9-6w36-pw47, GHSA-jg86-v3jv-hrpm, GHSA-mrfp-p49p-3hf2, GHSA-p4wg-p73j-c528, GHSA-p8hx-v2p6-rp84, GHSA-pchr-8j38-3x4p, GHSA-q45j-58j2-45rg, GHSA-rfgq-q3w2-pmv2, GHSA-v9pv-5gc8-w2m6, GHSA-vx6w-vv9f-6gvg, GHSA-w889-685w-c8fh, GHSA-xgh8-jp6q-p5x8, GHSA-xvh5-g6gv-559v, PYSEC-2026-4326, PYSEC-2026-4327, PYSEC-2026-4328
    "pyasn1>=0.6.4",
    "sqlparse>=0.6.0",
    "tornado>=6.5.9",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.13", # GHSA-394h-qwmc-48pf, GHSA-43mp-35q3-x3fq, GHSA-494p-63j8-28p3, GHSA-558c-9hv2-4prj, GHSA-6w3r-xr62-4xcp, GHSA-c978-59m8-c77v, GHSA-cw65-gx24-rc82, GHSA-cx28-75q4-x26q, GHSA-cx6f-vjhg-g3cc, GHSA-fc2g-4w5p-6whm, GHSA-hhxq-47xx-j5xx, GHSA-qmx5-4p3x-wvqf, GHSA-vxj4-q4g9-crj7
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
    "FBT",  # flake8-boolean-trap
    "PL",   # Pylint (includes PLC, PLE, PLR, PLW)
    "DTZ",  # flake8-datetimez (for your DTZ003 rule)
]

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "tests",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
tests = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]
"streamlit/**" = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", "venv", ".pytest_cache"]
python_files = ["*test.py", "test*.py"]
python_classes = ["*Test"]
python_functions = ["test_*", "when_*", "expect_*", "should_*"]
verbosity_assertions = 2
markers = [
    "unit: pure logic tests, no external services — no Docker required",
    "integration: tests that require one real external service (PostgreSQL or Redis)",
]
