name: "Deploy API Reco V2"

on:
  push:
    branches:
      - main
      - staging
      - production
    paths:
      - "apps/recommendation_v2/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production
      no_traffic:
        description: "Deploy without routing traffic (useful to prepare A/B testing)"
        required: true
        default: false
        type: boolean

env:
  DOCKER_REGISTRY_PROJECT_ID: "passculture-infra-prod"
  DOCKER_REGISTRY_REGION: "europe-west1"
  DOCKER_REGISTRY_REPOSITORY: "pass-culture-artifact-registry"

jobs:
  setup-job:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-variable.outputs.env_name }}
      no_traffic: ${{ steps.set-variable.outputs.no_traffic }}
    steps:
      - name: "Set environment variable"
        id: "set-variable"
        env:
          REF: ${{ github.ref }}
          ENV: ${{ inputs.environment }}
          NO_TRAFFIC: ${{ inputs.no_traffic }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "env_name=$ENV" | tee -a "$GITHUB_OUTPUT"
            echo "no_traffic=$NO_TRAFFIC" | tee -a "$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/main" ]; then
            echo "env_name=dev" | tee -a "$GITHUB_OUTPUT"
            echo "no_traffic=false" | tee -a "$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/staging" ]; then
            echo "env_name=staging" | tee -a "$GITHUB_OUTPUT"
            echo "no_traffic=false" | tee -a "$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/production" ]; then
            echo "env_name=production" | tee -a "$GITHUB_OUTPUT"
            echo "no_traffic=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "env_name=dev" | tee -a "$GITHUB_OUTPUT"
            echo "no_traffic=false" | tee -a "$GITHUB_OUTPUT"
          fi

  build-and-push-docker-image:
    name: "Build image job"
    needs: [setup-job]
    environment: ${{ needs.setup-job.outputs.env_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      DATA_GCP_PROJECT: ${{ vars.DATA_GCP_PROJECT }}
      ENV_SHORT_NAME: ${{ vars.ENV_SHORT_NAME }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: "Connect to Secret Manager"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_EHP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_EHP_SERVICE_ACCOUNT }}
      - name: "Get secrets for Artifact Registry"
        id: 'secrets'
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            ARTIFACT_REGISTRY_SERVICE_ACCOUNT:passculture-metier-ehp/passculture-main-artifact-registry-service-account
            ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER:passculture-metier-ehp/infra-prod-gcp-workload-identity-provider
      - name: "Output variables"
        id: "vars"
        run: echo "DOCKER_REPO=${DOCKER_REGISTRY_REGION}-docker.pkg.dev/${DOCKER_REGISTRY_PROJECT_ID}/${DOCKER_REGISTRY_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - name: "Get short SHA"
        id: "sha"
        run: echo "short_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: "openid-auth"
        name: "Authenticate with Google Cloud"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          create_credentials_file: false
          token_format: "access_token"
          workload_identity_provider: ${{ steps.secrets.outputs.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.secrets.outputs.ARTIFACT_REGISTRY_SERVICE_ACCOUNT }}

      - name: "Docker login"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: "${{ env.DOCKER_REGISTRY_REGION }}-docker.pkg.dev"
          username: "oauth2accesstoken"
          password: "${{ steps.openid-auth.outputs.access_token }}"

      - name: "Build and push docker image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/recommendation_v2
          push: true
          tags: |
            ${{ steps.vars.outputs.DOCKER_REPO }}/api-data/recommendation_v2:${{ steps.sha.outputs.short_sha }}
            ${{ steps.vars.outputs.DOCKER_REPO }}/api-data/recommendation_v2:latest

  deploy-api:
    runs-on: ubuntu-latest
    needs: [setup-job, build-and-push-docker-image]
    environment: ${{ needs.setup-job.outputs.env_name }}
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      # URL of the freshly deployed revision, reachable via its "latest" tag even when
      # no_traffic=true. Consumed by the smoke-test job.
      url: ${{ steps.resolve_tag_url.outputs.url }}
    env:
      DATA_GCP_PROJECT: ${{ vars.DATA_GCP_PROJECT }}
      ENV_SHORT_NAME: ${{ vars.ENV_SHORT_NAME }}
      TAG_NAME: "latest"
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: "Connect to Secret Manager"
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ secrets.GCP_EHP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_EHP_SERVICE_ACCOUNT }}
    - name: "Get secrets for Cloud Run"
      id: 'secrets'
      uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
      with:
        secrets: |-
          ARTIFACT_REGISTRY_SERVICE_ACCOUNT:passculture-metier-ehp/passculture-main-artifact-registry-service-account
          ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER:passculture-metier-ehp/infra-prod-gcp-workload-identity-provider
    - name: "Output variables"
      id: "vars"
      run: echo "DOCKER_REPO=${DOCKER_REGISTRY_REGION}-docker.pkg.dev/${DOCKER_REGISTRY_PROJECT_ID}/${DOCKER_REGISTRY_REPOSITORY}" >> "$GITHUB_OUTPUT"
    - name: "Get short SHA"
      id: "sha"
      env:
        ENV_SHORT_NAME: ${{ env.ENV_SHORT_NAME }}

      run: |
        echo "short_sha=${GITHUB_SHA}" | tee -a "$GITHUB_OUTPUT"
        echo "very_short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)" | tee -a "$GITHUB_OUTPUT"
        echo "rand=$(tr -dc 'a-z0-9' < /dev/urandom | head -c 3)" | tee -a "$GITHUB_OUTPUT"

        if [ "$ENV_SHORT_NAME" = "prod" ]; then
          echo "env_long_name=production" >> "$GITHUB_OUTPUT"
          echo "secret_env_name=production" >> "$GITHUB_OUTPUT"
        elif [ "$ENV_SHORT_NAME" = "stg" ]; then
          echo "env_long_name=staging" >> "$GITHUB_OUTPUT"
          echo "secret_env_name=$ENV_SHORT_NAME" >> "$GITHUB_OUTPUT"
        elif [ "$ENV_SHORT_NAME" = "dev" ]; then
          echo "env_long_name=testing" >> "$GITHUB_OUTPUT"
          echo "secret_env_name=$ENV_SHORT_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "env_long_name=$ENV_SHORT_NAME" >> "$GITHUB_OUTPUT"
          echo "secret_env_name=$ENV_SHORT_NAME" >> "$GITHUB_OUTPUT"
        fi

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      name: "Authenticate with Google Cloud for deploy"
      with:
        workload_identity_provider: ${{ steps.secrets.outputs.ARTIFACT_REGISTRY_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ steps.secrets.outputs.ARTIFACT_REGISTRY_SERVICE_ACCOUNT }}

    - id: 'deploy'
      name: 'Deploy to Cloud Run'
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
      with:
        service: "apireco-${{ env.ENV_SHORT_NAME }}"
        suffix: "v2-${{ steps.sha.outputs.very_short_sha }}-${{ steps.sha.outputs.rand }}"
        image: "${{ steps.vars.outputs.DOCKER_REPO }}/api-data/recommendation_v2:${{ steps.sha.outputs.short_sha }}"
        region: "${{ env.DOCKER_REGISTRY_REGION }}"
        project_id: ${{ env.DATA_GCP_PROJECT }}
        no_traffic: ${{ needs.setup-job.outputs.no_traffic }}
        tag: ${{ env.TAG_NAME }}
        env_vars_update_strategy: overwrite
        secrets_update_strategy: overwrite
        env_vars: |-
          ENV=${{ steps.sha.outputs.env_long_name }}
          GCP_PROJECT=${{ env.DATA_GCP_PROJECT }}
          SQL_PORT=5432
          VERTEX_RETRIEVAL_ENDPOINT_NAME=recommendation_user_retrieval_${{ env.ENV_SHORT_NAME }}
          VERTEX_RANKING_ENDPOINT_NAME=recommendation_user_ranking_${{ env.ENV_SHORT_NAME }}
          VERTEX_GRAPH_ENDPOINT_NAME=recommendation_graph_retrieval_${{ env.ENV_SHORT_NAME }}
          VERTEX_SEMANTIC_ENDPOINT_NAME=semantic_item_retrieval_${{ env.ENV_SHORT_NAME }}
          REDIS_CA_CERT_PATH=/secrets/redis-ca-cert
          SIMILAR_OFFER_MODEL_CONTEXT=default
          RECO_MODEL_CONTEXT=default
        secrets: |-
          API_TOKEN=api-reco-token-${{ env.ENV_SHORT_NAME }}:latest
          REDIS_AUTH_STRING=apireco-${{ env.ENV_SHORT_NAME }}_redis_auth_string:latest
          REDIS_URL=apireco-${{ env.ENV_SHORT_NAME }}_redis_url:latest
          /secrets/redis-ca-cert=apireco-${{ env.ENV_SHORT_NAME }}_redis_ca:latest
          SQL_BASE=cloudsql-recommendation-${{ steps.sha.outputs.secret_env_name }}-ew1_database_credentials_username:latest
          SQL_BASE_PASSWORD=cloudsql-recommendation-${{ steps.sha.outputs.secret_env_name }}-ew1_database_credentials_password:latest
          SQL_BASE_USER=cloudsql-recommendation-${{ steps.sha.outputs.secret_env_name }}-ew1_database_credentials_username:latest
          SQL_HOST=cloudsql-recommendation-${{ steps.sha.outputs.secret_env_name }}-ew1_private_ip:latest

    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: "Route 100% of traffic to the new revision"
      if: ${{ needs.setup-job.outputs.no_traffic != 'true' }}
      run: |
        gcloud run services update-traffic "apireco-${ENV_SHORT_NAME}" \
          --region "${DOCKER_REGISTRY_REGION}" \
          --project "${DATA_GCP_PROJECT}" \
          --to-latest
    - id: resolve_tag_url
      name:  "Resolve latest-tagged revision URL for smoke testing"
      run: |
        URL=$(gcloud run services describe "apireco-${ENV_SHORT_NAME}" \
          --region "${DOCKER_REGISTRY_REGION}" \
          --project "${DATA_GCP_PROJECT}" \
          --format='json(status.traffic)' \
          | jq -r --arg tag "$TAG_NAME" '.status.traffic[] | select(.tag==$tag) | .url')
        if [ -z "$URL" ] || [ "$URL" = "null" ]; then
          echo "❌ Could not resolve the '${TAG_NAME}'-tagged URL for apireco-${ENV_SHORT_NAME}"
          exit 1
        fi
        echo "Resolved tagged URL: $URL"
        echo "url=$URL" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: "Smoke test"
    needs: [setup-job, deploy-api]
    uses: ./.github/workflows/api_v2_smoke_test.yml
    permissions:
      contents: read
      id-token: write
    with:
      TARGET_ENV: ${{ needs.setup-job.outputs.env_name }}
      TARGET_URL: ${{ needs.deploy-api.outputs.url }}
    secrets:
      WORKLOAD_IDENTITY_PRD: ${{ secrets.WORKLOAD_IDENTITY_PRD }}

  slack-notification:
    runs-on: ubuntu-latest
    environment: ${{ needs.setup-job.outputs.env_name }}
    needs: [setup-job, deploy-api, smoke-test]
    permissions:
      id-token: write
    if: always()
    steps:
      - name: "Connect to Secret Manager"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_EHP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_EHP_SERVICE_ACCOUNT }}
      - name: "Get secrets for Slack"
        id: "secrets"
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SLACK_BOT_TOKEN:passculture-metier-ehp/passculture-ci-slack-bot-token
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3
      - name: "Post to a Slack channel"
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        env:
          SLACK_BOT_TOKEN: ${{ steps.secrets.outputs.SLACK_BOT_TOKEN }}
        with:
          channel-id: "C01GVAXM02W" # alerts_data
          payload: |
            {
              "attachments": [
                {
                  "mrkdwn_in": ["text"],
                  "color": "${{ env.WORKFLOW_CONCLUSION == 'failure' && '#A30002' || '#36a64f' }}",
                  "author_name": "${{github.actor}}",
                  "author_link": "https://github.com/${{github.actor}}",
                  "author_icon": "https://github.com/${{github.actor}}.png",
                  "title": "API Reco V2 Deployment",
                  "title_link": "https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}",
                  "text": "Le déploiement de `l'API reco v2 sur ${{ needs.setup-job.outputs.env_name }}` est ${{ env.WORKFLOW_CONCLUSION == 'failure' && 'échoué :boom:' || 'réussi :muscle:' }}"
                }
              ],
              "unfurl_links": false,
              "unfurl_media": false
            }
